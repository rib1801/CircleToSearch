name: Build APK

on:
  push:
    branches: ["*"]
    tags-ignore:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust (stable, host only)
        # Needed only for buildUniffiBindgen (plain host cargo). No NDK and no
        # cargo-ndk: the native libbindings.so is the committed prebuilt one.
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Clean build
        run: ./gradlew clean -PusePrebuiltBindings=true

      - name: Build Debug APK
        run: ./gradlew assembleDebug -PusePrebuiltBindings=true

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest -PusePrebuiltBindings=true

      - name: Run Android lint
        run: ./gradlew lintDebug -PusePrebuiltBindings=true

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease -PusePrebuiltBindings=true

      - name: Find release APKs
        id: find-apk
        run: |
          APK_DIR="app/build/outputs/apk/release"
          if [ -d "$APK_DIR" ]; then
            APK_COUNT=$(find "$APK_DIR" -name "*.apk" | wc -l)
            echo "apk_dir=$APK_DIR" >> $GITHUB_OUTPUT
            echo "apk_count=$APK_COUNT" >> $GITHUB_OUTPUT
            echo "Found $APK_COUNT release APK(s)"
          else
            echo "No release APK directory found"
            echo "apk_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload release APKs
        if: steps.find-apk.outputs.apk_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
